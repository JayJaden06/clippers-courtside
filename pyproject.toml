[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "courtside"
version = "0.1.0"
description = "Clippers Courtside: every Clippers game explained, the next game's odds and game plan, and why they blow second-half leads."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jaden Fong" }]
dependencies = [
    "nba_api>=1.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2",
    "pydantic-settings>=2",
    "matplotlib>=3.8",
    "plotly>=5",
    "typer>=0.12",
    "rich>=13",
    "tenacity>=8",
    "requests>=2.31",
]

[project.scripts]
courtside = "courtside.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pdfplumber>=0.11"]
# reads the NBA's injury report (a PDF) during `courtside pull`/`build`; the website doesn't need it
pipeline = ["pdfplumber>=0.11"]
dashboard = ["streamlit>=1.67"]

[tool.hatch.build.targets.wheel]
packages = ["src/courtside"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo lives under OneDrive, which denies writes to .pytest_cache.
addopts = "-p no:cacheprovider"
