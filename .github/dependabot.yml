# Weekly pull requests that bump pinned packages and GitHub Actions to fixed versions (security fixes included).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # pydantic pins its own pydantic-core exactly: bumped apart, the site can't install (2026-11-27 outage).
    groups:
      pydantic:
        patterns: ["pydantic", "pydantic-core"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
