name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: these jobs only read the code; nothing they run can push or change the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      # Tests run on recorded fixtures only; stats.nba.com blocks cloud IPs.
      - name: Test
        run: pytest -q
