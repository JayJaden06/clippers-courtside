[theme]
base = "light"
primaryColor = "#1d428a"
backgroundColor = "#f6f5f1"
secondaryBackgroundColor = "#ebe9e3"
textColor = "#1b2333"
# Body text: Schibsted Grotesk (tasteskill's pick for an editorial, media voice). Headlines and big numbers
# use Barlow Condensed, set in courtside/web/style.css.
font = "Schibsted Grotesk:https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap, sans-serif"

[client]
# Hide the Deploy button and developer menu from visitors.
toolbarMode = "viewer"
# If a page ever fails, visitors see the error's type, not a traceback with file paths and code.
# Locally, see everything with: $env:STREAMLIT_CLIENT_SHOW_ERROR_DETAILS="full"
showErrorDetails = "type"

[server]
# Streamlit's defaults, stated so they can't be switched off by accident.
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false
